<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Consulta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Sistema de Consultas</a>

    <div class="navbar-nav">
      <a class="nav-link" href="/consultas/lista">Consultas</a>
      <a class="nav-link" href="/consultas/nova">Agendar Consulta</a>
      <a class="nav-link" href="/pacientes/lista">Pacientes Cadastrados</a>
      <a class="nav-link" href="/pacientes/novo">Cadastrar Paciente</a>
    </div>
  </div>
</nav>

<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4"
    th:text="${consulta.id == null ? 'Nova Consulta' : 'Editar Consulta'}">
    </h1>

    <form th:action="@{/consultas/salvar}" th:object="${consulta}" method="post">

        <div class="mb-3">
            <label class="form-label">Paciente</label>
            <select class="form-select" 
                    th:field="*{paciente.id}">
                    required>
                <option value="">Selecione</option>
                <option th:each="p : ${pacientes}"
                        th:value="${p.id}"
                        th:text="${p.nome}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Data</label>
            <input type="date" class="form-control" th:field="*{data}">
        </div>

        <div class="mb-3">
            <label class="form-label">Hora</label>
            <input type="time" class="form-control" th:field="*{hora}">
        </div>

        <div class="mb-3">
            <label class="form-label">Especialidade</label>
            <input type="text" class="form-control" th:field="*{especialidade}">
        </div>

        <div class="mb-3">
            <label class="form-label">Observações</label>
            <textarea class="form-control" th:field="*{observacoes}"></textarea>
        </div>

        <button class="btn btn-primary">Salvar</button>
        <a href="/consultas/lista" class="btn btn-secondary">Cancelar</a>

    </form>
</div>

</body>
</html>
