<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    
    <title>Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Sistema de Consultas</a>

    <div class="navbar-nav">
      <a class="nav-link" href="/consultas/lista">Consultas</a>
      <a class="nav-link" href="/consultas/nova">Agendar Consulta</a>
      <a class="nav-link" href="/pacientes/lista">Pacientes Cadastrados</a>
      <a class="nav-link" href="/pacientes/novo">Cadastrar Paciente</a>
    </div>
  </div>
</nav>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Pacientes Cadastrados</h2>

    <a th:href="@{/pacientes/novo}" class="btn btn-primary mb-3">
    Cadastrar Paciente
    </a>

    <table class="table table-striped table-hover shadow">
        <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>Cartão SUS</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="p : ${pacientes}">
                <td th:text="${p.nome}"></td>
                <td th:text="${p.cpf}"></td>
                <td th:text="${p.cartaoSus}"></td>
                <td>
                    <a th:href="@{/pacientes/editar/{id}(id=${p.id})}"
                        class="btn btn-sm btn-warning me-2">Editar</a>

                    <a th:href="@{/pacientes/excluir/{id}(id=${p.id})}"
                        class="btn btn-sm btn-danger"
                        onclick="return confirm('Tem certeza que deseja excluir?')">Excluir</a>
                </td>
            </tr>

        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(consultas)}" class="alert alert-info">
    Nenhum paciente encontrado.
</div>

</div>

</body>

</html>
