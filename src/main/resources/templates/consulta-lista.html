<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Sistema de Consultas</a>

    <div class="navbar-nav">
      <a class="nav-link" href="/consultas/lista">Consultas</a>
      <a class="nav-link" href="/consultas/nova">Agendar Consulta</a>
      <a class="nav-link" href="/pacientes/lista">Pacientes Cadastrados</a>
      <a class="nav-link" href="/pacientes/novo">Cadastrar Paciente</a>
    </div>
  </div>
</nav>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Consultas</h2>
        <a href="/consultas/nova" class="btn btn-primary">
            Agendar Consulta
        </a>
    </div>

<form method="get" class="row g-3 mb-4">

    <div class="col-md-4">
        <label class="form-label">Paciente</label>
        <select name="pacienteId" class="form-select">
            <option value="">Todos</option>
            <option th:each="p : ${pacientes}"
                    th:value="${p.id}"
                    th:text="${p.nome}">
            </option>
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Data</label>
        <input type="date" name="data" class="form-control">
    </div>

    <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-primary w-100">Filtrar</button>
    </div>

</form>


    <table class="table table-striped table-hover shadow">
<thead class="table-dark">
    <tr>
        <th>Paciente</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Especialidade</th>
        <th>Ações</th>
    </tr>
</thead>

<tbody>
    <tr th:each="c : ${consultas}">
        <td th:text="${c.paciente.nome}"></td>
        <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy')}"></td>
        <td th:text="${c.hora}"></td>
        <td th:text="${c.especialidade}"></td>
        <td>
            <a th:href="@{/consultas/editar/{id}(id=${c.id})}"
               class="btn btn-sm btn-warning me-2">
                Editar
            </a>

            <a th:href="@{/consultas/excluir/{id}(id=${c.id})}"
               class="btn btn-sm btn-danger"
               onclick="return confirm('Deseja excluir esta consulta?')">
                Excluir
            </a>
        </td>
    </tr>
</tbody>

    </table>

    <div th:if="${#lists.isEmpty(consultas)}" class="alert alert-info">
    Nenhuma consulta cadastrada.
</div>

</div>

</body>
</html>
