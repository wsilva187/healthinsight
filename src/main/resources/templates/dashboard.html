<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">onsultas</h1>

    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card text-bg-primary shadow">
                <div class="card-body text-center">
                    <h5>Total de Pacientes</h5>
                    <h2 th:text="${totalPacientes}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-bg-success shadow">
                <div class="card-body text-center">
                    <h5>Total de Consultas</h5>
                    <h2 th:text="${totalConsultas}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-bg-warning shadow">
                <div class="card-body text-center">
                    <h5>Consultas Hoje</h5>
                    <h2 th:text="${consultasHoje.size()}"></h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card shadow">
        <div class="card-header">
            <strong>Consultas de Hoje</strong>
        </div>

        <table class="table table-striped mb-0">
            <thead>
                <tr>
                    <th>Paciente</th>
                    <th>Data</th>
                    <th>Hora</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${consultasHoje}">
                    <td th:text="${c.paciente.nome}"></td>
                    <td th:text="${c.data}"></td>
                    <td th:text="${c.hora}"></td>
                </tr>

                <tr th:if="${consultasHoje.empty}">
                    <td colspan="3" class="text-center text-muted">
                        Nenhuma consulta hoje
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <a href="/pacientes/lista" class="btn btn-outline-primary me-2">Pacientes</a>
        <a href="/consultas/lista" class="btn btn-outline-success">Consultas</a>
    </div>

</div>

</body>
</html>
